<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Songify — Your Music, Simply</title>
    <meta name="description" content="A clean, minimalistic music player with a multi-language song library." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <audio id="audio-player" preload="metadata"></audio>

      <section class="player" aria-label="Now playing">
        <div class="brand">
          <span>Songify<span class="dot">.</span></span>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"><i class="bi bi-sun" id="theme-icon"></i></button>
        </div>

        <div class="art-wrap" id="art-wrap">
          <img id="song-image" src="media/10.jpg" alt="Album art" />
        </div>

        <div class="song-meta">
          <h1 id="song-title">Select a song</h1>
          <p id="song-artist">&nbsp;</p>
        </div>

        <div class="progress-container">
          <span class="time" id="time-current">0:00</span>
          <input
            type="range"
            class="song-progress"
            id="progress-bar"
            min="0"
            max="100"
            step="0.1"
            value="0"
            aria-label="Seek"
          />
          <span class="time" id="time-duration">0:00</span>
        </div>

        <div class="controls">
          <button id="shuffle-btn" class="icon-btn" type="button" aria-label="Shuffle" title="Shuffle"><i class="bi bi-shuffle"></i></button>
          <button id="prev-btn" class="icon-btn" type="button" aria-label="Previous" title="Previous"><i class="bi bi-skip-start-fill"></i></button>
          <button id="play-btn" class="icon-btn" type="button" aria-label="Play" title="Play / Pause"><i class="bi bi-play-fill" id="play-icon"></i></button>
          <button id="next-btn" class="icon-btn" type="button" aria-label="Next" title="Next"><i class="bi bi-skip-end-fill"></i></button>
          <button id="loop-btn" class="icon-btn" type="button" aria-label="Loop" title="Loop"><i class="bi bi-repeat"></i></button>
        </div>

        <div class="volume-row">
          <i class="bi bi-volume-down" aria-hidden="true"></i>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" />
        </div>
      </section>

      <section class="library" aria-label="Song library">
        <div class="library-header">
          <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" id="search-input" placeholder="Search songs or artists..." aria-label="Search songs" />
          </div>
          <div class="filters" id="filters" role="tablist" aria-label="Filter by language"></div>
        </div>
        <ul class="playlist" id="playlist" aria-label="Playlist"></ul>
      </section>
    </main>

    <script src="songs.js"></script>
    <script src="script.js"></script>
  </body>
</html>
